name: Release

on:
  push:
    branches:
      - main
      - master
      - development

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Loads the built artifacts the way consumers do; the unit tests import
      # TypeScript sources and cannot catch a wrong module format.
      - name: Smoke test built package
        run: npm run smoke

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'skip release')"
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Versioning happens in place rather than through a release PR, so merging
      # into a release branch publishes directly. Consumes any pending changesets
      # into the version, changelog and lockfile.
      - name: Apply pending changesets
        run: npm run release:version

      - name: Commit the version bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m 'chore: version packages'
          git push origin HEAD:"$GITHUB_REF_NAME"

      # Publishes whatever is now unpublished and creates the git tag and GitHub
      # release. Publishing goes through the runner's own npm, so it uses OIDC
      # trusted publishing and needs no long-lived token; provenance comes from
      # publishConfig.
      - name: Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release

  jsr:
    name: Publish to JSR
    needs: release
    runs-on: ubuntu-latest
    # A custom `if` replaces the implicit success() gate that `needs` provides,
    # so it is restated: a failed release job must not publish to JSR on the
    # strength of a stale output.
    if: success() && needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      # The release job commits the version bump during this run, so the
      # triggering commit still carries the previous version. Check out the
      # branch tip instead, or JSR republishes the version already released.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # package.json is the version source of truth under changesets, so the
      # version is read locally rather than polled back from the registry.
      - name: Sync jsr.json version
        run: |
          node -e "
            const fs = require('fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = version;
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          "

      # A checkout at the wrong commit made this job republish an existing
      # version and still report success. Publishing something npm did not just
      # publish is a failure, so it is asserted rather than assumed.
      - name: Verify the checkout matches what npm published
        env:
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.publishedPackages }}
        run: |
          node -e "
            const fs = require('fs');
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES);
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!published.some((entry) => entry.version === version)) {
              console.error('checked out ' + version + ', npm published ' + JSON.stringify(published));
              process.exit(1);
            }
            console.log('publishing ' + version + ' to JSR');
          "

      - name: Publish to JSR
        run: npm run publish:jsr
